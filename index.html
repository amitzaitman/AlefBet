<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlefBet — סִפְרִיַּית מִשְׂחָקִים</title>
  <!-- הגופנים מגיעים מ-alefbet.css המקומי (ללא רשת); המחלקות שלו ממושמעות
       תחת .alefbet-game ולכן אינן משפיעות על עיצוב דף הבית. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#C9442C">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="framework/dist/runtime.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --primary: #4f67ff;
      --bg:      #f0f2ff;
      --surface: #ffffff;
      --text:    #1a1a2e;
      --muted:   #6c757d;
      --font:    'Rubik', 'Heebo', 'Arial Hebrew', Arial, sans-serif;
    }

    html, body {
      margin: 0; padding: 0;
      min-height: 100dvh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      direction: rtl;
    }

    /* ── Header ── */
    .hub-header {
      background: var(--surface);
      border-bottom: 1px solid #dee2e6;
      padding: clamp(12px, 3dvh, 20px) clamp(16px, 4dvw, 32px);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hub-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .hub-logo__badge {
      width:  clamp(44px, 10dvmin, 56px);
      height: clamp(44px, 10dvmin, 56px);
      background: linear-gradient(135deg, #4f67ff, #7c94ff);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(22px, 5dvmin, 30px);
      font-weight: 900;
      color: #fff;
      box-shadow: 0 4px 12px rgba(79,103,255,0.35);
      flex-shrink: 0;
    }

    .hub-logo__title {
      font-size: clamp(20px, 4dvmin, 28px);
      font-weight: 900;
      color: var(--primary);
      margin: 0;
      line-height: 1.1;
    }

    .hub-logo__sub {
      font-size: clamp(12px, 2.5dvmin, 15px);
      color: var(--muted);
      margin: 0;
    }

    /* ── Main ── */
    .hub-main {
      padding: clamp(16px, 4dvh, 40px) clamp(16px, 4dvw, 32px);
      max-width: 900px;
      margin: 0 auto;
    }

    .hub-subtitle {
      font-size: clamp(18px, 4dvmin, 26px);
      font-weight: 700;
      color: var(--text);
      margin: 0 0 clamp(12px, 3dvh, 24px) 0;
    }

    .subject-nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 32px; }
    .subject-link { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; min-height: 72px; padding: 14px 20px; border: 2px solid #c9d3ff; border-radius: 16px; background: #eef1ff; color: #293f96; text-decoration: none; font-size: 1.2rem; font-weight: 700; flex: 1 1 230px; }
    .subject-link--math { background: #e8f7f1; border-color: #a6d8c6; color: #175d48; }
    .subject-link--other { background: #fff6df; border-color: #ead39c; color: #725215; }
    .subject-link small { font-size: .85rem; font-weight: 400; margin-inline-start: auto; }
    .subject-link:focus-visible, .game-card:focus-visible { outline: 3px solid #293f96; outline-offset: 4px; }
    .subject-section { margin-bottom: 40px; scroll-margin-top: 20px; }
    .subject-title { margin: 0; font-size: clamp(24px, 5dvmin, 30px); color: #293f96; }
    .subject-section--math .subject-title { color: #175d48; }
    .subject-description { color: var(--muted); margin: 6px 0 18px; }
    .subject-section--math .game-card__icon { background: #e8f7f1; }
    .game-card__topic { display: inline-block; align-self: flex-start; margin-bottom: 8px; padding: 4px 10px; border-radius: 999px; background: #e8f7f1; color: #175d48; font-size: .85rem; font-weight: 600; }

    /* ── Games Grid ── */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
      gap: clamp(12px, 3dvmin, 24px);
    }

    /* ── Game Card ── */
    .game-card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: 20px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.14);
    }

    .game-card:active { transform: scale(0.98); }

    /* Icon area */
    .game-card__icon {
      height: clamp(120px, 22dvh, 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Letter-Match icon */
    .game-card__icon--letters {
      background: linear-gradient(135deg, #fff3e0, #ffe0b2);
    }

    .icon--letters-letter {
      font-size: clamp(60px, 14dvmin, 90px);
      font-weight: 900;
      color: #ff6b00;
      line-height: 1;
      position: absolute;
      right: 20%;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font);
    }

    .icon--letters-emoji {
      font-size: clamp(40px, 9dvmin, 60px);
      position: absolute;
      left: 20%;
      top: 50%;
      transform: translateY(-55%);
    }

    /* Nikud icon */
    .game-card__icon--nikud {
      background: linear-gradient(135deg, #e8eaff, #d4d9ff);
    }

    .icon--nikud-samples {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 8px;
    }

    .icon--nikud-chip {
      display: flex;
      align-items: center;
      justify-content: center;
      width:  clamp(36px, 8dvmin, 52px);
      height: clamp(36px, 8dvmin, 52px);
      border-radius: 10px;
      font-size: clamp(18px, 5dvmin, 28px);
      font-weight: 900;
      font-family: var(--font);
      color: #fff;
    }

    /* Syllable Read icon */
    .game-card__icon--syllables {
      background: linear-gradient(135deg, #e3f7ef, #c7ecdd);
    }

    .icon--syllable {
      font-size: clamp(50px, 12dvmin, 80px);
      font-weight: 900;
      color: #1d7a4f;
      font-family: var(--font);
      line-height: 1.4;
    }

    /* Sound Studio icon */
    .game-card__icon--studio {
      background: linear-gradient(135deg, #fff3d6, #ffe6ad);
    }

    .icon--studio-mic {
      font-size: clamp(60px, 14dvmin, 90px);
      position: absolute;
    }

    /* Nikud Speak icon */
    .game-card__icon--speak {
      background: linear-gradient(135deg, #ffeef8, #ffd4e9);
    }

    .icon--speak-mic {
      font-size: clamp(60px, 14dvmin, 90px);
      position: absolute;
    }

    /* Info area */
    .game-card__info {
      padding: clamp(12px, 2.5dvh, 20px);
      flex: 1;
    }

    .game-card__name {
      font-size: clamp(16px, 3.5dvmin, 22px);
      font-weight: 900;
      margin: 0 0 6px 0;
      color: var(--text);
    }

    .game-card__desc {
      font-size: clamp(13px, 2.5dvmin, 16px);
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    /* Play button */
    .game-card__play {
      display: block;
      margin: 0 clamp(12px, 2.5dvh, 20px) clamp(12px, 2.5dvh, 20px);
      padding: clamp(10px, 2dvh, 14px);
      background: var(--primary);
      color: #fff;
      border-radius: 12px;
      text-align: center;
      font-size: clamp(14px, 3dvmin, 18px);
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: background 0.15s;
    }

    .game-card:hover .game-card__play {
      background: #3451e0;
    }

    /* ── Progress stars badge (from localStorage) ── */
    .game-card { position: relative; }

    .game-card__stars {
      position: absolute;
      top: 10px;
      inset-inline-start: 10px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: clamp(13px, 2.6dvmin, 16px);
      letter-spacing: 2px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      pointer-events: none;
    }

    .hub-adult-tools { margin-top: 28px; }
    .hub-adult-tools summary { cursor: pointer; padding: 20px; min-height: 64px; font-weight: 700; }
    .hub-adult-tools[open] summary { margin-bottom: 12px; }

    /* ── Footer ── */
    .hub-footer {
      text-align: center;
      padding: clamp(16px, 4dvh, 32px);
      font-size: clamp(12px, 2.5dvmin, 14px);
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="hub-header">
    <div class="hub-logo">
      <div class="hub-logo__badge">א</div>
      <div>
        <p class="hub-logo__title">AlefBet</p>
        <p class="hub-logo__sub">סִפְרִיַּית מִשְׂחָקֵי קְרִיאָה וְחֶשְׁבּוֹן</p>
      </div>
    </div>
  </header>

  <main class="hub-main">
    <h1 class="hub-subtitle">בְּמָה נְשַׂחֵק הַיּוֹם?</h1>
    <nav class="subject-nav" aria-label="תחומי לימוד"></nav>
    <div class="subject-sections"></div>
    <details class="hub-adult-tools">
      <summary>להורים ולמורים</summary>
      <div class="teacher-tools-grid games-grid"></div>
    </details>
  </main>

  <footer class="hub-footer">
    AlefBet — מִשְׂחָקִים חִינּוּכִיִּים לִילָדִים
  </footer>


  <script src="games/catalog.js"></script>
  <script>
    (function renderHub() {
      var ICONS = {
        letters:
          '<span class="icon--letters-letter">א</span>' +
          '<span class="icon--letters-emoji">🦁</span>',
        nikud:
          '<div class="icon--nikud-samples">' +
            '<div class="icon--nikud-chip" style="background:#FF6B6B;">אָ</div>' +
            '<div class="icon--nikud-chip" style="background:#4ECDC4;">אִ</div>' +
            '<div class="icon--nikud-chip" style="background:#2ECC71;">אֹ</div>' +
            '<div class="icon--nikud-chip" style="background:#9B59B6;">אֶ</div>' +
          '</div>',
        syllables: '<span class="icon--syllable">בָּ · מִ · שׁוֹ</span>',
        speak: '<span class="icon--speak-mic">🎤</span>',
        studio: '<span class="icon--studio-mic">🎙️</span>',
      };

      var catalog = self.ALEFBET_CATALOG || [];
      var categories = self.ALEFBET_CATEGORIES || [];
      var destinations = {};
      var categoryFor = function (game) {
        return categories.some(function (category) { return category.id === game.category; }) ? game.category : 'other';
      };
      categories.forEach(function (category) {
        var games = catalog.filter(function (game) { return game.kind !== 'teacher-tool' && categoryFor(game) === category.id; });
        if (!games.length) return;
        var section = document.createElement('section');
        section.className = 'subject-section subject-section--' + category.id;
        section.id = 'subject-' + category.id;
        section.setAttribute('aria-labelledby', section.id + '-title');
        var heading = document.createElement('h2');
        heading.id = section.id + '-title';
        heading.className = 'subject-title';
        heading.textContent = category.title;
        var description = document.createElement('p');
        description.className = 'subject-description';
        description.textContent = category.desc;
        var grid = document.createElement('div');
        grid.className = 'games-grid';
        section.append(heading, description, grid);
        document.querySelector('.subject-sections').appendChild(section);
        destinations[category.id] = grid;
        var link = document.createElement('a');
        link.href = '#' + section.id;
        link.className = 'subject-link subject-link--' + category.id;
        var symbol = document.createElement('span');
        symbol.setAttribute('aria-hidden', 'true');
        symbol.textContent = category.icon;
        var label = document.createElement('span');
        label.textContent = category.title;
        var count = document.createElement('small');
        count.textContent = games.length + ' משחקים';
        link.append(symbol, label, count);
        document.querySelector('.subject-nav').appendChild(link);
      });
      catalog.forEach(function (game) {
        var card = document.createElement('a');
        card.href = 'games/' + game.id + '/';
        card.className = 'game-card';
        if (game.kind === 'game') card.setAttribute('data-game-id', game.id);

        var icon = document.createElement('div');
        icon.className = 'game-card__icon game-card__icon--' + game.icon;
        if (ICONS[game.icon]) icon.innerHTML = ICONS[game.icon];
        else { icon.textContent = game.icon || '🎲'; icon.style.fontSize = '64px'; }
        card.appendChild(icon);

        var info = document.createElement('div');
        info.className = 'game-card__info';
        var name = document.createElement('h3');
        name.className = 'game-card__name';
        name.textContent = game.title;
        var desc = document.createElement('p');
        desc.className = 'game-card__desc';
        desc.textContent = game.desc;
        if (game.topic) {
          var topic = document.createElement('span');
          topic.className = 'game-card__topic';
          topic.textContent = game.topic;
          info.appendChild(topic);
        }
        info.appendChild(name);
        info.appendChild(desc);
        card.appendChild(info);

        var play = document.createElement('span');
        play.className = 'game-card__play';
        play.textContent = game.play;
        card.appendChild(play);

        (game.kind === 'teacher-tool' ? document.querySelector('.teacher-tools-grid') : destinations[categoryFor(game)]).appendChild(card);
      });

      // כוכבי התקדמות: core/progress.js שומר שיאים ב-localStorage.
      var progress;
      try { progress = JSON.parse(localStorage.getItem('alefbet.progress.v1')) || {}; }
      catch (e) { progress = {}; }
      document.querySelectorAll('.game-card[data-game-id]').forEach(function (card) {
        var entry = progress[card.dataset.gameId];
        if (!entry || !entry.bestStars) return;
        var badge = document.createElement('span');
        badge.className = 'game-card__stars';
        badge.textContent = '\u2b50'.repeat(entry.bestStars);
        badge.setAttribute('aria-label', entry.bestStars + ' כוכבים');
        card.appendChild(badge);
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    })();
  </script>
</body>
</html>
