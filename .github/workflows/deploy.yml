name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Select offline stability checks
        run: node scripts/ci-scope.js

      - uses: ./.github/actions/verify
        with:
          stability: ${{ steps.scope.outputs.stability }}

      - name: Assemble site
        run: |
          mkdir -p _site/framework
          touch _site/.nojekyll
          cp index.html sw.js manifest.webmanifest _site/
          cp -r assets _site/assets
          cp -r framework/dist _site/framework/dist
          cp -r games _site/games

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
