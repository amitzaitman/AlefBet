<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="alefbet-recovery-page" content="1">
  <title>רענון מלא — AlefBet</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f0f2ff; color: #253054; font: 18px/1.7 system-ui, sans-serif; }
    main { max-width: 560px; margin: 10vh auto; padding: 28px; background: white; border-radius: 20px; }
    h1 { font-size: 1.6rem; }
    button, a { display: inline-flex; align-items: center; min-height: 64px; padding: 12px 20px; border-radius: 12px; font: inherit; }
    button { color: white; background: #394fd1; border: 0; cursor: pointer; }
    [hidden] { display: none; }
    @media(max-width: 600px) { main { margin: 24px 16px; } }
  </style>
</head>
<body>
<main>
  <h1>מרעננים את האפליקציה</h1>
  <p>ההתקדמות, התוכן השמור וההקלטות נשמרים.</p>
  <p id="status" role="status" aria-live="polite">מתחברים לשרת…</p>
  <button id="retry" type="button" hidden>ניסיון נוסף</button>
  <a href="./">חזרה לדף הבית</a>
</main>
<script>
(async function refreshApp() {
  const status = document.getElementById('status');
  document.getElementById('retry').addEventListener('click', () => location.reload());
  const root = new URL('./', location.href);
  async function bounded(promise) {
    let timer;
    try {
      return await Promise.race([promise, new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error('Update timed out')), 20000);
      })]);
    } finally { clearTimeout(timer); }
  }
  function waitForState(worker, states) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => finish(new Error('Worker timed out')), 20000);
      function finish(error) {
        clearTimeout(timer);
        worker.removeEventListener('statechange', check);
        if (error) reject(error); else resolve();
      }
      function check() {
        if (worker.state === 'redundant') finish(new Error('Update failed'));
        else if (states.includes(worker.state)) finish();
      }
      worker.addEventListener('statechange', check);
      check();
    });
  }
  try {
    if (!('serviceWorker' in navigator)) throw new Error('Service worker unavailable');
    status.textContent = 'בודקים את הגרסה העדכנית…';
    const registration = await bounded(navigator.serviceWorker.register(new URL('sw.js', root), { updateViaCache: 'none' }));
    if (registration.installing) await waitForState(registration.installing, ['installed', 'activated']);
    await bounded(registration.update());
    if (registration.installing) await waitForState(registration.installing, ['installed', 'activated']);
    const worker = registration.waiting || registration.active;
    if (!worker) throw new Error('No worker');
    status.textContent = 'מורידים מחדש את קובצי האפליקציה…';
    await new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      const timer = setTimeout(() => finish(new Error('Refresh timed out')), 30000);
      function finish(error) {
        clearTimeout(timer);
        channel.port1.close();
        channel.port2.close();
        if (error) reject(error); else resolve();
      }
      channel.port1.onmessage = event => finish(event.data?.ok ? null : new Error('Download failed'));
      worker.postMessage({ type: 'refresh-assets' }, [channel.port2]);
    });
    await waitForState(worker, ['activated']);
    status.textContent = 'הרענון הושלם. חוזרים למשחקים…';
    location.replace(new URL('./?refreshed=' + Date.now(), root));
  } catch (error) {
    status.textContent = 'הרענון לא הושלם. בדקו חיבור לאינטרנט ונסו שוב. הנתונים האישיים נשמרו.';
    document.getElementById('retry').hidden = false;
  }
})();
</script>
</body>
</html>
