<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="alefbet-recovery-page" content="1">
  <title>רענון מלא — AlefBet</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f0f2ff; color: #253054; font: 18px/1.7 system-ui, sans-serif; }
    main { max-width: 560px; margin: 10vh auto; padding: 28px; background: white; border-radius: 20px; }
    h1 { font-size: 1.6rem; }
    button, a { display: inline-flex; align-items: center; min-height: 64px; padding: 12px 20px; border-radius: 12px; font: inherit; }
    button { color: white; background: #394fd1; border: 0; cursor: pointer; }
    [hidden] { display: none; }
    @media(max-width: 600px) { main { margin: 24px 16px; } }
  </style>
</head>
<body>
<main>
  <h1>מרעננים את האפליקציה</h1>
  <p>ההתקדמות, התוכן השמור וההקלטות נשמרים.</p>
  <p id="status" role="status" aria-live="polite">מתחברים לשרת…</p>
  <button id="retry" type="button" hidden>ניסיון נוסף</button>
  <a href="./">חזרה לדף הבית</a>
</main>
<script>
(async function refreshApp() {
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  retry.addEventListener('click', () => location.reload());
  const root = new URL('./', location.href);
  const attempt = Number(new URL(location.href).searchParams.get('attempt') || 0);
  const download = async url => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    try {
      const response = await fetch(url, { cache: 'reload', signal: controller.signal });
      if (!response.ok) throw new Error('Download failed');
      return await response.arrayBuffer();
    } finally { clearTimeout(timer); }
  };
  try {
    // The manifest and this recovery page are never served from the worker cache.
    const bytes = await download(new URL('framework/dist/release-manifest.js', root));
    const source = new TextDecoder().decode(bytes);
    const match = source.match(/^self\.ALEFBET_RELEASE = ([\s\S]+);\s*$/);
    if (!match) throw new Error('Invalid release');
    const release = JSON.parse(match[1]);
    if (!release.assets || !Array.isArray(release.core)) throw new Error('Invalid release');
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const registration of registrations) {
        if (registration.scope === root.href && !await registration.unregister()) throw new Error('Cannot unregister');
      }
      // Unregistering does not detach the worker from the current document.
      // Navigate to this uncached page again before downloading canonical URLs.
      if (navigator.serviceWorker.controller) {
        if (attempt >= 2) throw new Error('Other tabs are registering a worker');
        location.replace(new URL('refresh.html?attempt=' + (attempt + 1), root));
        return;
      }
    }
    const entries = Object.entries(release.assets);
    let downloaded = 0;
    const downloadAsset = async ([path, expectedHash]) => {
      const url = new URL(path, root);
      if (url.origin !== root.origin || !url.pathname.startsWith(root.pathname)) throw new Error('Invalid asset path');
      const body = await download(url);
      const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', body))]
        .map(byte => byte.toString(16).padStart(2, '0')).join('');
      if (hash !== expectedHash) throw new Error('Release changed during refresh');
      status.textContent = `מורידים קבצים מחדש… ${++downloaded} מתוך ${entries.length}`;
    };
    // Bound concurrency; every HTTP-cache entry is revalidated, including lazy editor files.
    let cursor = 0;
    let failed = false;
    const results = await Promise.allSettled(Array.from({ length: 4 }, async () => {
      try {
        while (!failed && cursor < entries.length) await downloadAsset(entries[cursor++]);
      } catch (error) { failed = true; throw error; }
    }));
    if (results.some(result => result.status === 'rejected')) throw new Error('Download incomplete');
    if ('caches' in window) {
      for (const name of await caches.keys()) {
        if (!name.startsWith('alefbet-')) continue;
        const cache = await caches.open(name);
        const requests = await cache.keys();
        // Other applications on the same origin retain their caches.
        if (requests.length && requests.every(request => request.url.startsWith(root.href))) await caches.delete(name);
      }
    }
    // Never clear localStorage or IndexedDB: they hold progress, content and recordings.
    status.textContent = 'הרענון הושלם. חוזרים למשחקים…';
    location.replace(new URL('./?refreshed=' + Date.now(), root));
  } catch (error) {
    status.textContent = 'הרענון לא הושלם. בדקו חיבור לאינטרנט, סגרו לשוניות נוספות של האפליקציה ונסו שוב. הנתונים האישיים נשמרו.';
    retry.hidden = false;
  }
})();
</script>
</body>
</html>
